{% extends 'base.html' %}

{% block page_title %}Eliminar Producto{% endblock %}

{% block content %}
<div class="glass-panel" style="padding: 32px; max-width: 500px; margin: 0 auto; text-align: center;">
    <div style="color: var(--danger); font-size: 3rem; margin-bottom: 16px;">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    
    <h3 style="margin-bottom: 12px;">¿Estás seguro?</h3>
    <p style="color: var(--text-secondary); margin-bottom: 32px;">
        Estás a punto de eliminar el producto <strong>{{ object.nombre }} ({{ object.sku }})</strong>. Esta acción no se puede deshacer.
    </p>

    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 16px; justify-content: center;">
            <a href="{% url 'producto_list' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        </div>
    </form>
</div>
{% endblock %}
