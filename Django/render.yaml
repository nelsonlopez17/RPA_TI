services:
  - type: web
    name: erp-django
    runtime: python
    pythonVersion: 3.11
    
    # Build: instalar dependencias
    buildCommand: pip install -r requirements.txt
    
    # Start: usar entrypoint.sh que hace migraciones y luego inicia gunicorn
    startCommand: bash entrypoint.sh gunicorn configuracion_base.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 60 --access-logfile -
    
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        scope: secret
      - key: ALLOWED_HOSTS
        value: your-app-name.onrender.com
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        scope: secret
      - key: DB_HOST
        scope: secret
      - key: DB_PORT
        value: "5432"
