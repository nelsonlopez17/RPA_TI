services:
  - type: web
    name: erp-django
    runtime: python
    pythonVersion: 3.11
    
    # Build: instalar dependencias
    buildCommand: pip install -r requirements.txt
    
    # Start: ejecutar gunicorn (las migraciones se hacen en el init script)
    startCommand: bash -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn configuracion_base.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        scope: secret
      - key: ALLOWED_HOSTS
        value: your-app-name.onrender.com
      - key: DATABASE_URL
        scope: secret
