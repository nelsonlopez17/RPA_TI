{% extends 'base.html' %}

{% block page_title %}Dashboard - Power BI{% endblock %}

{% block content %}
<!-- Cabecera de Bienvenida Dinámica -->
<div style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
    <div>
        <h2 id="dynamic-greeting" style="font-weight: 700; margin-bottom: 4px; font-size: 1.75rem;">¡Hola, Bienvenido!</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Panel de análisis interactivo — ChardonayStore</p>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
        <div style="font-size: 0.9rem; color: var(--text-secondary); background: rgba(255,255,255,0.04); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px);">
            <i class="fa-regular fa-calendar-days" style="color: var(--accent);"></i>
            <span id="current-date" style="font-weight: 500;">Cargando fecha...</span>
        </div>
    </div>
</div>

<!-- Contenedor del Dashboard Power BI -->
<div class="glass-panel" style="padding: 0; overflow: hidden; border-radius: 16px; position: relative; width: 100%;">
    <!-- Barra superior del panel -->
    <div style="
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
        background: rgba(255, 255, 255, 0.02);
    ">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="
                width: 36px; height: 36px;
                background: linear-gradient(135deg, #f2c811 0%, #e8a90e 100%);
                border-radius: 10px;
                display: flex; align-items: center; justify-content: center;
                box-shadow: 0 4px 12px rgba(242, 200, 17, 0.3);
            ">
                <i class="fa-solid fa-chart-column" style="color: #1a1a2e; font-size: 1rem;"></i>
            </div>
            <div>
                <h3 style="font-weight: 600; font-size: 1rem; margin: 0; color: var(--text-primary);">Dashboard Power BI</h3>
                <span style="font-size: 0.75rem; color: var(--text-secondary);">Análisis interactivo en tiempo real</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="powerbi-status-dot"></span>
            <span style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 500;">Conectado</span>
        </div>
    </div>

    <!-- iframe de Power BI -->
    <div id="powerbi-container" style="
        width: 100%;
        height: calc(100vh - 220px);
        min-height: 500px;
        position: relative;
        background: #0d1117;
    ">
        <!-- Loader animado mientras carga el iframe -->
        <div id="powerbi-loader" style="
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 5;
            background: #0d1117;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        ">
            <div class="powerbi-spinner"></div>
            <span style="color: #94a3b8; font-size: 0.9rem; font-weight: 500;">Cargando dashboard...</span>
        </div>

        <iframe
            id="powerbi-iframe"
            title="Dashboard Power BI - ChardonayStore"
            src="https://app.powerbi.com/view?r=eyJrIjoiZTRkNWZhNjUtNDQwYy00NTY2LTlhMWQtMjIzNDFjZTVmNmM1IiwidCI6IjVmNTNiNGNlLTYzZDQtNGVlOC04OGQyLTIyZjBiMmQ0YjI3YSIsImMiOjR9"
            style="
                width: 100%;
                height: 100%;
                border: none;
                display: block;
            "
            allowfullscreen="true"
            frameborder="0"
        ></iframe>
    </div>
</div>

<!-- Estilos específicos para el dashboard Power BI -->
<style>
    /* Indicador de estado "Conectado" con pulso */
    .powerbi-status-dot {
        width: 8px;
        height: 8px;
        background: #34d399;
        border-radius: 50%;
        display: inline-block;
        position: relative;
    }
    .powerbi-status-dot::before {
        content: '';
        position: absolute;
        top: -3px; left: -3px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: rgba(52, 211, 153, 0.3);
        animation: pbiPulse 2s ease-in-out infinite;
    }

    @keyframes pbiPulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.5); opacity: 0; }
    }

    /* Spinner de carga */
    .powerbi-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(242, 200, 17, 0.15);
        border-top-color: #f2c811;
        border-radius: 50%;
        animation: pbiSpin 0.8s linear infinite;
    }

    @keyframes pbiSpin {
        to { transform: rotate(360deg); }
    }

    /* Responsividad del iframe container */
    @media (max-width: 768px) {
        #powerbi-container {
            height: calc(100vh - 200px) !important;
            min-height: 400px !important;
        }
    }

    @media (max-width: 480px) {
        #powerbi-container {
            height: calc(100vh - 180px) !important;
            min-height: 350px !important;
        }
    }
</style>

<!-- Scripts -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Saludo dinámico según la hora del día
        const now = new Date();
        const hours = now.getHours();
        let greeting = "¡Hola!";

        if (hours >= 5 && hours < 12) {
            greeting = "¡Buenos días, {{ request.user.username }}! ☀️";
        } else if (hours >= 12 && hours < 19) {
            greeting = "¡Buenas tardes, {{ request.user.username }}! 🌤️";
        } else {
            greeting = "¡Buenas noches, {{ request.user.username }}! 🌙";
        }
        document.getElementById('dynamic-greeting').textContent = greeting;

        // 2. Fecha actual con formato largo en español
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        let formattedDate = now.toLocaleDateString('es-ES', dateOptions);
        formattedDate = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
        document.getElementById('current-date').textContent = formattedDate;

        // 3. Ocultar loader cuando el iframe haya cargado
        const iframe = document.getElementById('powerbi-iframe');
        const loader = document.getElementById('powerbi-loader');

        iframe.addEventListener('load', function() {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
        });

        // Timeout de seguridad: ocultar loader después de 8 segundos
        // por si el evento 'load' no se dispara correctamente
        setTimeout(function() {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
        }, 8000);
    });
</script>
{% endblock %}
